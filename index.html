<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aria - AI Companion</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: #1e293b;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      background: #0f172a;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      display: grid;
      place-items: center;
      font-size: 22px;
    }

    .chat {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }

    .msg {
      max-width: 80%;
      padding: 11px 14px;
      margin: 10px 0;
      border-radius: 16px;
      line-height: 1.4;
    }

    .ai {
      background: #334155;
    }

    .user {
      background: #8b5cf6;
      margin-left: auto;
    }

    .bar {
      padding: 12px;
      background: #0f172a;
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 22px;
      border: 1px solid #475569;
      background: #1e293b;
      color: white;
    }

    button {
      border: 0;
      border-radius: 22px;
      padding: 10px 15px;
      background: #8b5cf6;
      color: white;
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="avatar">A</div>
      <div>
        <h3>Aria</h3>
        <small>Online • AI Companion</small>
      </div>
    </header>

    <div class="chat" id="chat">
      <div class="msg ai">
        Hii! Main Aria hoon. Tum kaise ho? 😊
      </div>
    </div>

    <div class="bar">
      <input id="input" placeholder="Kuch bolo..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("input");
      const chat = document.getElementById("chat");
      const text = input.value.trim();

      if (!text) return;

      const userMessage = document.createElement("div");
      userMessage.className = "msg user";
      userMessage.textContent = text;
      chat.appendChild(userMessage);

      input.value = "";

      setTimeout(() => {
        const aiMessage = document.createElement("div");
        aiMessage.className = "msg ai";
        aiMessage.textContent =
          "Main tumhari baat sun rahi hoon 😊 Real AI connection hum secure tareeke se add karenge.";
        chat.appendChild(aiMessage);
        chat.scrollTop = chat.scrollHeight;
      }, 500);
    }

    document.getElementById("input").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
