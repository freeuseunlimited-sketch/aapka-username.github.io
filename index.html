<!DOC><!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Companion</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: #0f172a; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 10px; }
        .chat-card { width: 100%; max-width: 450px; height: 90vh; max-height: 680px; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .header { background: #1e293b; padding: 16px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(135deg, #ec4899, #8b5cf6); display: flex; justify-content: center; align-items: center; font-weight: bold; color: white; font-size: 20px; box-shadow: 0 0 12px rgba(236, 72, 153, 0.5); }
        .user-info h3 { color: #f8fafc; font-size: 16px; font-weight: 600; }
        .status { color: #10b981; font-size: 12px; display: flex; align-items: center; gap: 5px; }
        .status::before { content: ""; width: 7px; height: 7px; background: #10b981; border-radius: 50%; display: inline-block; }
        .chat-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.5; word-wrap: break-word; opacity: 0; transform: translateY(10px); animation: fadeIn 0.3s forwards; }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        .ai-msg { background: #334155; color: #f1f5f9; border-bottom-left-radius: 4px; align-self: flex-start; }
        .user-msg { background: linear-gradient(135deg, #ec4899, #8b5cf6); color: white; border-bottom-right-radius: 4px; align-self: flex-end; }
        .typing { display: none; align-self: flex-start; background: #334155; color: #94a3b8; padding: 10px 16px; border-radius: 18px; font-size: 13px; font-style: italic; }
        .input-area { padding: 15px; background: #1e293b; display: flex; gap: 10px; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        input { flex: 1; background: #0f172a; border: 1px solid #475569; border-radius: 12px; padding: 12px 16px; color: white; font-size: 14px; outline: none; }
        input:focus { border-color: #ec4899; }
        button { background: linear-gradient(135deg, #ec4899, #8b5cf6); border: none; border-radius: 12px; padding: 12px 16px; color: white; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="chat-card">
        <div class="header">
            <div class="avatar">AI</div>
            <div class="user-info">
                <h3>Aria (AI Friend)</h3>
                <div class="status">Online</div>
            </div>
        </div>
        <div class="chat-area" id="chatArea">
            <div class="msg ai-msg">Hii! Main Aria hoon. Batao aaj kya chal raha hai? 😊</div>
        </div>
        <div class="typing" id="typingIndicator">Aria typing...</div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Kuch bolo..." onkeydown="if(event.key==='Enter') sendMsg()">
            <button onclick="sendMsg()">Send</button>
            <button onclick="startVoice()">🎙️</button>
        </div>
    </div>

    <script>
        function sendMsg() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chatArea');
            const text = input.value.trim();
            if(!text) return;

            // Add User Message
            const uMsg = document.createElement('div');
            uMsg.className = 'msg user-msg';
            uMsg.textContent = text;
            chat.appendChild(uMsg);
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            // Show Typing Indicator
            const typing = document.getElementById('typingIndicator');
            typing.style.display = 'block';

            // Simulate Reply
            setTimeout(() => {
                typing.style.display = 'none';
                const aiMsg = document.createElement('div');
                aiMsg.className = 'msg ai-msg';
                aiMsg.textContent = getReply(text);
                chat.appendChild(aiMsg);
                chat.scrollTop = chat.scrollHeight;
            }, 1000);
        }

        function getReply(msg) {
            const t = msg.toLowerCase();
            if(t.includes('kaise ho') || t.includes('kasi ho')) return "Main ekdum badiya hoon! Tum batao?";
            if(t.includes('naam')) return "Mera naam Aria hai!";
            if(t.includes('hello') || t.includes('hi')) return "Hii there! Kaise ho?";
            return "Sahi baat hai! Thoda aur batao iske baare mein?";
        }

        function startVoice() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SR) { alert("Speech Recognition not supported."); return; }
            const rec = new SR();
            rec.lang = 'hi-IN';
            rec.onresult = (e) => {
                document.getElementById('userInput').value = e.results[0][0].transcript;
                sendMsg();
            };
            rec.start();
        }
    </script>
</body>
</html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meri AI Friend</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; background: linear-gradient(135deg, #ffd6e7, #d9e7ff); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .app { width: 95%; max-width: 500px; height: 650px; background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px #0003; display: flex; flex-direction: column; }
        header { background: #ff4f91; color: white; padding: 18px; text-align: center; }
        header h2 { margin: 0; }
        #chat { flex: 1; padding: 15px; overflow-y: auto; }
        .message { padding: 11px 14px; margin: 9px 0; border-radius: 15px; max-width: 80%; line-height: 1.4; word-wrap: break-word; }
        .ai { background: #f1f1f1; margin-right: auto; }
        .user { background: #ff4f91; color: white; margin-left: auto; }
        .controls { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 10px; font-size: 15px; }
        button { border: none; border-radius: 10px; padding: 10px 13px; background: #ff4f91; color: white; cursor: pointer; }
        button:hover { background: #e83276; }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <h2>Meri AI Friend</h2>
            <small>Always here to talk</small>
        </header>
        <div id="chat">
            <div class="message ai">Hii! Main tumhari AI friend hoon. Tumhara naam kya hai?</div>
        </div>
        <div class="controls">
            <input id="messageInput" placeholder="Apna message likho..." />
            <button onclick="sendMessage()">Send</button>
            <button onclick="startVoice()">🎙️</button>
        </div>
    </div>

    <script>
        let userName = localStorage.getItem("userName") || "";

        function addMessage(text, type) {
            const chat = document.getElementById("chat");
            const message = document.createElement("div");
            message.className = "message " + type;
            message.textContent = text;
            chat.appendChild(message);
            chat.scrollTop = chat.scrollHeight;
        }

        function getReply(message) {
            const text = message.toLowerCase();
            if (text.includes("mera naam")) {
                userName = message.split("mera naam").pop().trim();
                localStorage.setItem("userName", userName);
                return "Nice to meet you, " + userName + "! 😊";
            }
            if (text.includes("hello") || text.includes("hii") || text.includes("hi")) {
                return "Hii " + (userName || "friend") + "! Aaj ka din kaisa ja raha hai?";
            }
            if (text.includes("kaise ho")) {
                return "Main bilkul theek hoon! Tum batao, tum kya kar rahe ho?";
            }
            if (text.includes("time")) {
                return "Abhi time hai " + new Date().toLocaleTimeString();
            }
            if (text.includes("bye")) {
                return "Bye! Apna dhyan rakhna 💕";
            }
            return "Main samajhne ki koshish kar rahi hoon. Thoda aur detail mein batao?";
        }

        function sendMessage() {
            const input = document.getElementById("messageInput");
            const message = input.value.trim();
            if (!message) return;
            addMessage(message, "user");
            input.value = "";
            setTimeout(() => {
                const reply = getReply(message);
                addMessage(reply, "ai");
                speak(reply);
            }, 500);
        }

        function speak(text) {
            if ("speechSynthesis" in window) {
                const speech = new SpeechSynthesisUtterance(text);
                speech.lang = "hi-IN";
                window.speechSynthesis.speak(speech);
            }
        }

        function startVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Voice recognition is not supported in this browser.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = "hi-IN";
            recognition.onresult = function(event) {
                document.getElementById("messageInput").value = event.results[0][0].transcript;
                sendMessage();
            };
            recognition.start();
        }

        document.getElementById("messageInput").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
</html>
