<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aria - AI Companion</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: #1e293b;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        @media (min-height: 700px) and (min-width: 500px) {
            .chat-container {
                height: 90vh;
                border-radius: 20px;
                box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
                border: 1px solid #334155;
            }
        }

        .header {
            padding: 16px;
            background: #0f172a;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #334155;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 18px;
        }

        .user-info h2 {
            font-size: 16px;
            font-weight: 600;
        }

        .status {
            font-size: 12px;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status::before {
            content: "";
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
        }

        .chat-box {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .ai-msg {
            background: #334155;
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .user-msg {
            background: #8b5cf6;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .typing {
            display: none;
            font-size: 12px;
            color: #94a3b8;
            font-style: italic;
            margin-left: 4px;
        }

        .input-bar {
            padding: 12px 16px;
            background: #0f172a;
            border-top: 1px solid #334155;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 24px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #8b5cf6;
        }

        button {
            background: #8b5cf6;
            border: none;
            color: white;
            padding: 12px 16px;
            border-radius: 24px;
            font-weight: 600;
            cursor: pointer;
        }

        button:active {
            opacity: 0.8;
        }

        .icon-btn {
            background: #334155;
            padding: 12px;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="header">
            <div class="avatar">A</div>
            <div class="user-info">
                <h2>Aria</h2>
                <div class="status">Online</div>
            </div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="msg ai-msg">Hii! Main Aria hoon. Kaise ho aap? 😊</div>
        </div>

        <div class="typing" id="typing">Aria typing...</div>

        <div class="input-bar">
            <input type="text" id="userInput" placeholder="Kuch bolo..." onkeydown="if(event.key==='Enter') send()">
            <button onclick="send()">Send</button>
            <button class="icon-btn" onclick="startVoice()">🎙️</button>
        </div>
    </div>

    <script>
        const API_KEY = "AQ.Ab8RN6IPImdRwv8ToQ9YnCD9gZP0KXoyLTx4RhIVCuvsk1ZQfA";

        async function send() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chatBox');
            const text = input.value.trim();
            if (!text) return;

            const uDiv = document.createElement('div');
            uDiv.className = 'msg user-msg';
            uDiv.textContent = text;
            chat.appendChild(uDiv);
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            const typing = document.getElementById('typing');
            typing.style.display = 'block';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: `You are Aria, a friendly AI companion talking in casual Hinglish/Hindi. Keep responses short and natural. User: ${text}` }]
                        }]
                    })
                });

                const data = await response.json();
                typing.style.display = 'none';

                let reply = "Thoda network issue hai, dubara try karein.";
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    reply = data.candidates[0].content.parts[0].text;
                }

                const aiDiv = document.createElement('div');
                aiDiv.className = 'msg ai-msg';
                aiDiv.textContent = reply;
                chat.appendChild(aiDiv);
                chat.scrollTop = chat.scrollHeight;

                speak(reply);
            } catch (err) {
                typing.style.display = 'none';
                const errDiv = document.createElement('div');
                errDiv.className = 'msg ai-msg';
                errDiv.textContent = "Error: Key check karein.";
                chat.appendChild(errDiv);
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const speech = new SpeechSynthesisUtterance(text);
                speech.lang = 'hi-IN';
                window.speechSynthesis.speak(speech);
            }
        }

        function startVoice() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return alert("Speech recognition supported nahi hai.");
            const rec = new SR();
            rec.lang = 'hi-IN';
            rec.onresult = (e) => {
                document.getElementById('userInput').value = e.results[0][0].transcript;
                send();
            };
            rec.start();
        }
    </script>
</body>
</html>
